[package]
name = "kimbo-placement"
version = "1.0.0"
edition = "2021"
description = "Assistant de placement pour la Canopée du Kimbo (Dofus)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "x11"] }
# On n'active que DirectX 12 (principal) et OpenGL (repli) : pas de Vulkan/Metal/WebGPU.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "gles"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
